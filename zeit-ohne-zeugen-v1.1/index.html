<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeit ohne Zeugen</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="main-header">
      <img
        src="bilder/zeit-ohne-zeugen-logo.png"
        alt="Zeit ohne Zeugen – Tauche ein in die Zeit von 1933 bis 1945"
        class="main-logo"
      />
      <p>Wähle eine Station aus.</p>
    </header>

    <main>
      <section class="progress-section" aria-labelledby="progress-text">
        <div class="progress-heading-row">
          <p id="progress-text">0 von 7 Stationen abgeschlossen</p>
        </div>

        <div
          id="progress-bar"
          class="progress-bar"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="7"
          aria-valuenow="0"
          aria-labelledby="progress-text"
        >
          <div id="progress-fill" class="progress-fill"></div>
        </div>

        <p id="bonus-unlocked-message" class="bonus-unlocked-message" hidden>
          Bonus-Station freigeschaltet
        </p>
      </section>

      <section
        id="stations-container"
        class="stations-grid"
        aria-label="Verfügbare Stationen"
      ></section>

      <section class="reset-section">
        <button id="reset-button" class="secondary-button" type="button">
          Fortschritt zurücksetzen
        </button>
      </section>
    </main>

    <footer class="app-footer">
      <button id="privacy-link" class="footer-link" type="button">
        Hinweis zum Datenschutz
      </button>

      <span class="footer-divider" aria-hidden="true">•</span>

      <button id="imprint-link" class="footer-link" type="button">
        Impressum
      </button>
    </footer>

    <div id="modal-overlay" class="modal-overlay" hidden>
      <section
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <div class="modal-header">
          <h2 id="modal-title"></h2>

          <button
            id="modal-close"
            class="modal-close"
            type="button"
            aria-label="Fenster schließen"
          >
            ×
          </button>
        </div>

        <div id="modal-content" class="modal-content"></div>
      </section>
    </div>

    <script src="stations.js"></script>
    <script src="app.js"></script>
  </body>
</html>
